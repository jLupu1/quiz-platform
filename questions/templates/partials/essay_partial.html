<div id="section-essay" class="card border-0 shadow-sm rounded-4 mb-4 question-section">
    <div class="card-header bg-success text-white py-3">
        <h4 class="h5 mb-0 fw-bold"><i class="bi bi-justify me-2"></i> Essay Settings</h4>
    </div>
    <div class="card-body p-4">
        <div class="row g-3">
            <div class="col-md-3">
                <label class="form-label fw-bold">Min Words</label>
                <input type="number" class="form-control" name="essay_minword" value="{{ essay_options.minimum_word_count }}">
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold">Max Words</label>
                <input type="number" class="form-control" name="essay_maxword" value="{{ essay_options.maximum_word_count }}">
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold">Max Mark</label>
                <input type="number" step="0.1" class="form-control" name="essay_max_mark" value="{{ essay_options.maximum_mark }}">
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold small">Negative Mark</label>
                <input type="number" step="0.1" class="form-control" name="essay_negative_mark" value="{{ essay_options.negative_mark }}">
            </div>
            <div class="col-12 mt-3">
                <label class="form-label fw-bold">Model Answer (Recommended for improved automated grading)</label>
                <textarea class="form-control" name="essay_model_answer" rows="4">{{ essay_options.model_answer }}</textarea>
            </div>

            <div class="col-md-6 d-flex align-items-center">
                <div class="form-check form-switch fs-5 mb-0">
                    <input class="form-check-input" type="checkbox" role="switch" id="essay_is_auto_marked" name="essay_is_auto_marked" value="1" {% if essay_options.is_auto_mark %} checked {% endif %}>
                    <label class="form-check-label fs-6 fw-bold ms-2 mt-1" for="essay_is_auto_marked">Enable Auto-Marking Engine</label>
                </div>
            </div>

            <div class="col-12 mt-3">
                <label class="form-label fw-bold">Marking Rubric (PDF or Image)</label>
            <p class="text-muted text-sm">Recommended for better automated grading accuracy</p>

                {% if essay_options.marking_rubric %}
                    <div id="rubric-display-box" class="mb-3 p-3 border border-secondary-subtle rounded bg-light d-flex align-items-center justify-content-between shadow-sm">
                        <div>
                            <i class="bi bi-file-earmark-check-fill text-success me-2 fs-5 align-middle"></i>
                            <a href="{{ essay_options.marking_rubric.url }}" target="_blank" class="text-decoration-none fw-bold align-middle">
                                View Current Rubric
                            </a>
                        </div>

                        <input type="hidden" name="clear_essay_rubric" id="clear_rubric_input" value="off">

                        <button type="button" class="btn btn-outline-danger btn-sm fw-bold shadow-sm" onclick="removeRubric()">
                            <i class="bi bi-trash"></i> Remove
                        </button>
                    </div>

                    <script>
                        function removeRubric() {
                            document.getElementById('clear_rubric_input').value = 'on';

                            let displayBox = document.getElementById('rubric-display-box');

                            displayBox.classList.remove('d-flex');
                            displayBox.classList.add('d-none');
                        }
                    </script>
                {% endif %}

                <input type="file" class="form-control" name="essay_marking_rubric" accept="application/pdf, image/png, image/jpeg, image/jpg">
                <div class="form-text text-muted small">Max file size: 5MB. Acceptable formats: PDF, JPG, PNG.</div>
            </div>
        </div>
    </div>
</div>
